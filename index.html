<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0804" />

    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" type="image/x-icon" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Typographie « Miel & Braise »: Marcellus pour les grands moments,
         Sora pour l'interface. AUTO-HÉBERGÉES (`node scripts/polices.mjs`):
         elles venaient de fonts.googleapis.com par une feuille externe qui
         bloquait le premier rendu et envoyait l'IP de chaque joueur chez
         Google. Le jeu reste lisible si elles ne chargent pas: la pile système
         prend le relais, et `font-display: swap` n'attend personne. -->
    <link rel="preload" href="/fonts/sora-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/polices.css" />

    <!-- SEO -->
    <meta name="description" content="Crumbora — Clique, forge des cookies, gagne des Goldens, mine des CrumbCoins (CRMB) et vise l’infini." />

    <!-- Open Graph -->
    <meta property="og:title" content="Crumbora" />
    <meta property="og:description" content="Forge des cookies, Goldens &amp; CRMB. Clique vers l’infini." />
    <meta property="og:type" content="website" />
    <!-- `og:url`, `canonical` et l'URL ABSOLUE de l'image sont injectées au
         build depuis `VITE_SITE_URL` (voir vite.config.js). Sans domaine
         configuré, elles sont simplement absentes: une balise vide ou pointant
         vers un domaine d'exemple vaut moins que pas de balise du tout. -->
    <!--%SITE_META%-->
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Un gros cookie aux pépites de chocolat" />
    <meta property="og:locale" content="fr_FR" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Crumbora" />
    <meta name="twitter:description" content="Forge des cookies, Goldens &amp; CRMB. Clique vers l’infini." />
    <meta name="twitter:image" content="/og-image.png" />
    <meta name="twitter:image:alt" content="Un gros cookie aux pépites de chocolat" />

    <title>Crumbora</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
