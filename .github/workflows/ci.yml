name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build de production
        run: npm run build
